<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Fotospots</title>
    <meta name="description" content="The page you were looking for is not on this map.">
    <meta name="robots" content="noindex">

    <meta name="apple-itunes-app" content="app-id=6466506171">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <script>
      (function () {
        var lang = 'en';
        try {
          var saved = localStorage.getItem('photospots-lang');
          if (saved === 'en' || saved === 'de') lang = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-lang', lang);
        root.setAttribute('lang', lang);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="fs-404-lang">
      <div class="fs-lang-toggle" role="group" aria-label="Language">
        <button type="button" class="fs-lang-btn" data-lang="en" aria-label="English">EN</button>
        <button type="button" class="fs-lang-btn" data-lang="de" aria-label="Deutsch">DE</button>
      </div>
    </div>
    <main class="fs-404 fs-topo-section">
      <svg class="fs-topo" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <g class="fs-topo-group" stroke-width="1.5">
          <path d="M -60 140 C 400 100 760 180 1500 120"></path>
          <path d="M -60 200 C 400 160 760 240 1500 180"></path>
          <path d="M -60 260 C 400 212 760 308 1500 236"></path>
          <path d="M -60 320 C 400 264 760 376 1500 292"></path>
          <path d="M -60 380 C 400 322 760 436 1500 348"></path>
          <path d="M -60 440 C 400 386 760 498 1500 410"></path>
          <path d="M -60 600 C 460 644 830 556 1500 622"></path>
          <path d="M -60 660 C 460 704 830 616 1500 682"></path>
          <path d="M -60 730 C 460 768 830 692 1500 749"></path>
          <path d="M -60 800 C 460 832 830 760 1500 812"></path>
        </g>
      </svg>
      <div class="fs-404-inner">
        <svg class="fs-404-map" viewBox="0 0 240 120" role="img" aria-label="A map pin dropped with a dashed trail leading off the edge of the map." focusable="false">
          <g class="fs-404-map-trail" fill="none" stroke-linecap="round">
            <path d="M 8 92 L 46 82"></path>
            <path d="M 62 74 L 96 60"></path>
            <path d="M 112 52 L 138 44"></path>
          </g>
          <g class="fs-404-map-pin">
            <path class="fs-404-map-pin-body" d="M 160 20 C 176 20 188 32 188 48 C 188 66 160 92 160 92 C 160 92 132 66 132 48 C 132 32 144 20 160 20 Z"></path>
            <circle class="fs-404-map-pin-dot" cx="160" cy="48" r="6"></circle>
          </g>
          <ellipse class="fs-404-map-pin-shadow" cx="160" cy="98" rx="14" ry="3"></ellipse>
        </svg>
        <div class="fs-eyebrow fs-404-eyebrow">404 // OFF THE MAP</div>
        <div class="fs-404-coords">NO COORDINATES FOUND</div>
        <hr class="fs-404-rule">
        <h1 class="fs-404-h1">Nothing pinned here.</h1>
        <p class="fs-404-body">
          <span class="fs-l-en">The page you were looking for is not on this map.</span>
          <span class="fs-l-de">Hier ist nichts markiert.</span>
        </p>
        <div class="fs-404-cta">
          <a href="/">Back to the start →</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var buttons = document.querySelectorAll('.fs-lang-btn');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener('click', function (event) {
            var next = event.currentTarget.getAttribute('data-lang');
            if (next !== 'en' && next !== 'de') return;
            var root = document.documentElement;
            root.setAttribute('data-lang', next);
            root.setAttribute('lang', next);
            try { localStorage.setItem('photospots-lang', next); } catch (e) {}
          });
        }
      })();
    </script>
  </body>
</html>
